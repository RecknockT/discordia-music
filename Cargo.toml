[package]
name = "discordia-music"
version = "0.1.0"
edition = "2024"
description = "Optional installable music activity service for Discordia."
repository = "https://github.com/RecknockT/discordia-music"
default-run = "discordia-music"
publish = false

[workspace]
resolver = "2"

[features]
activity = ["dep:discordia-bot", "dep:sha2", "dep:hex", "tokio/fs", "tokio/io-util", "tokio/signal", "tokio/sync"]
audio-keys = ["activity", "discordia-bot/audio-keys"]
audio = ["dep:symphonia", "dep:rubato", "tokio/sync"]
transport = ["audio", "dep:livekit"]

[[bin]]
name = "discordia-music-activity"
path = "src/bin/activity.rs"
required-features = ["activity"]

[[bin]]
name = "discordia-music-audio-check"
path = "src/bin/audio_check.rs"
required-features = ["audio"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
discordia-bot = { git = "https://github.com/ssotomayor/discordia", rev = "25ccc4054ae521493e3ee340fd1086436d9cadeb", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"], optional = true }
rubato = { version = "=5.0.1", optional = true }
livekit = { version = "=0.9.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
discordia-server = { git = "https://github.com/ssotomayor/discordia", rev = "25ccc4054ae521493e3ee340fd1086436d9cadeb", default-features = false }
tempfile = "3"
livekit-api = { version = "0.5", default-features = false, features = ["access-token"] }
futures-util = "0.3"

[patch.crates-io]
webrtc-sys = { git = "https://github.com/ssotomayor/discordia", rev = "25ccc4054ae521493e3ee340fd1086436d9cadeb" }
webrtc-sys-build = { git = "https://github.com/ssotomayor/discordia", rev = "25ccc4054ae521493e3ee340fd1086436d9cadeb" }
livekit = { git = "https://github.com/ssotomayor/discordia", rev = "25ccc4054ae521493e3ee340fd1086436d9cadeb" }

[profile.dev.package.sha2]
opt-level = 3
